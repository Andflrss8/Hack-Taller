services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"          # host:contenedor -> MySQL escucha en 3306 dentro del contenedor
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) en vez de localhost (socket): durante la inicialización,
      # MySQL arranca un servidor temporal sin red; así el healthcheck solo pasa
      # cuando el servidor definitivo ya acepta conexiones.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      BASCULA_API_KEY: ${BASCULA_API_KEY:-clave-de-ejemplo}
    volumes:
      # Sincroniza tu código local con el contenedor (hot-reload con --reload)
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: