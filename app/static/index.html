<body class="bg-abyss font-sans text-ink">
<div class="flex min-h-screen flex-col">
<header class="sticky top-0 z-10 bg-brand text-white shadow-md"><div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-4 gap-y-2 px-5 py-3">
<a href="#/" aria-label="Heart&amp;Eat, inicio" class="flex items-center gap-2.5"><span aria-hidden="true" class="mk h-9 w-9"></span><span class="font-display text-2xl">Heart&amp;Eat</span></a>
<nav id="nav" class="order-last flex w-full gap-1 overflow-x-auto md:order-none md:w-auto"></nav>
<span id="api" class="rounded-full border border-white/60 px-4 py-2 text-sm font-semibold">Conectando…</span>
</div></header>
<main id="app" class="mx-auto w-full max-w-6xl flex-1 px-5 py-8"></main>
<footer class="border-t border-line py-8 text-center text-sm text-mute"><span aria-hidden="true" class="mk mx-auto mb-3 block h-8 w-8 text-brand"></span>Heart&amp;Eat: inteligencia para tu inventario, contra el desperdicio de alimentos en México.</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const g=(o,...k)=>{for(const x of k)if(o&&o[x]!=null&&o[x]!=='')return o[x];return ''};
const e=(o,...k)=>esc(g(o,...k));
// Si se abre como archivo local, apunta a la API en localhost:8000; servido por la API usa rutas relativas.
const BASE=location.protocol.startsWith('http')?'':'http://localhost:8000';
const call=async(m,u,b)=>{const r=await fetch(BASE+u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});const t=await r.text();let j=t;try{j=JSON.parse(t)}catch{}
 if(!r.ok){const d=j&&j.detail;throw new Error(r.status+': '+(typeof d==='string'?d:d?JSON.stringify(d):t||r.statusText))}return j};

const CATS=[[1,'Panadería'],[2,'Frutas y verduras'],[3,'Lácteos'],[4,'Platillos preparados'],[5,'Abarrotes']];
const TIPOS={NO_CONECTA:'No conecta',PESO_INCORRECTO:'Peso incorrecto',OTRO:'Otro'};
const SIG={PENDIENTE:['CONFIRMADA','Confirmar'],CONFIRMADA:['RECOGIDA','Marcar recogida']};
const S={tab:'bascula',lect:[],cat:[],bas:[],pred:[],ofe:[],res:[],rec:[],pre:null,loc:{ofe:[],res:[],rec:[]}};
const all=k=>[...S.loc[k],...S[k]];
const cats=()=>S.cat.length?S.cat:CATS.map(([id,nombre])=>({id,nombre}));
const catName=id=>(cats().find(c=>c.id==id)||{}).nombre||'';
const now=()=>new Date().toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});

// ── Estilos Heart&Eat ──
const I='w-full rounded-2xl border border-line bg-abyss px-4 py-3 text-sm text-ink outline-none focus:border-brand';
const card=(c,h)=>`<div class="rounded-3xl border border-line bg-panel p-5 shadow-sm ${c}">${h}</div>`;
const tone={ACTIVA:'bg-emerald-500/15 text-emerald-700',RECOGIDA:'bg-emerald-500/15 text-emerald-700',RESUELTO:'bg-emerald-500/15 text-emerald-700',PENDIENTE:'bg-amber-400/15 text-amber-700',ABIERTO:'bg-amber-400/15 text-amber-700',CONFIRMADA:'bg-sky-400/15 text-sky-700'};
const badge=s=>{s=String(s||'ACTIVA');return `<span class="rounded-full px-3 py-1 text-xs font-medium ${tone[s]||'bg-ink/5 text-mute'}">${esc(s.replace('_',' ').toLowerCase())}</span>`};
const B='inline-flex items-center justify-center rounded-full px-5 py-2.5 text-sm font-semibold transition disabled:opacity-60';
const bp=`${B} bg-brand text-white hover:bg-deep`, bg=`${B} border border-brand/40 text-brand hover:bg-brand/5`;
const title=(h,s)=>`<div class="mb-6"><h1 class="font-display text-3xl font-medium">${h}</h1>${s?`<p class="mt-1 text-mute">${s}</p>`:''}</div><div id="note"></div>`;
const F=(l,h)=>`<label class="block"><span class="mb-1 block text-xs font-medium text-mute">${l}</span>${h}</label>`;
const inp=(n,t,x='')=>`<input name="${n}" type="${t}" class="${I}" ${x}>`;
const sel=(n,k)=>`<select name="${n}" data-sel="${k}" class="${I}"></select>`;
const row='flex flex-wrap items-center justify-between gap-3 rounded-2xl';
const empty=t=>`<p class="col-span-full py-10 text-center text-mute">${t}</p>`;
const loc=o=>o._local?'<p class="text-xs text-mute">Solo en pantalla</p>':'';
const NT={ok:'bg-emerald-500/15 text-emerald-700',wait:'bg-amber-400/15 text-amber-700',err:'bg-brand/10 text-deep'};
const note=(k,t)=>{const n=$('#note');if(n){n.className='mb-4 rounded-2xl px-4 py-3 text-sm '+NT[k];n.textContent=t}};

// ── Listas ──
const L={
 bascula:()=>S.lect.map(l=>card(row,`<p class="font-medium">${esc(l.c)}</p><p class="text-xl font-semibold text-brand">${l.g.toFixed(1)} g</p><p class="text-sm text-mute">${l.h}${l.s?' · simulada':''}</p>`)).join('')||empty('Aún no hay lecturas en esta sesión.'),
 dispositivos:()=>S.bas.map(b=>card(row,`<div><p class="font-medium">${e(b,'alias','codigo_dispositivo')}</p><p class="text-sm text-mute">${e(b,'codigo_dispositivo')}</p></div><p class="text-sm text-mute">Última conexión ${g(b,'ultima_conexion')?esc(new Date(b.ultima_conexion).toLocaleString('es-MX')):'—'}</p>${badge(b.activa===false?'AGOTADA':'ACTIVA')}`)).join('')||empty('No hay básculas registradas.'),
 predicciones:()=>S.pred.map((p,i)=>card(row,`<div><p class="font-medium">${esc(g(p,'categoria','categoria_nombre')||catName(p.categoria_id))}</p><p class="text-sm text-mute">${e(p,'fecha_objetivo','fecha','para')}</p></div><p class="text-xl font-semibold text-brand">${e(p,'kg_estimado','excedente_estimado_kg','cantidad_kg','kg')} kg</p><p class="text-sm text-mute">Confianza ${e(p,'confianza')}</p><button data-a="pre" data-i="${i}" class="${bg}">Crear oferta</button>`)).join('')||empty('Aún no hay predicciones.'),
 ofertas:()=>all('ofe').map(o=>card('h-full rounded-2xl',`<div class="flex items-start justify-between gap-2"><span class="text-sm text-brand">${esc(g(o,'categoria')||catName(o.categoria_id))}</span>${badge(g(o,'estado'))}</div><h3 class="mt-3 text-lg font-medium">${e(o,'titulo','nombre','producto')}</h3><p class="text-sm text-mute">${e(o,'ciudad')} · ${e(o,'horario_recogida','horario')}</p><p class="mt-3 text-xl font-semibold text-brand">${e(o,'cantidad_kg','kg')} kg</p>${loc(o)}`)).join('')||empty('Aún no hay ofertas publicadas.'),
 reservas:()=>all('res').map(r=>card(row,`<div><p class="font-medium">${esc(g(r,'oferta','oferta_titulo')||'Oferta #'+g(r,'oferta_id'))}</p><p class="text-sm text-mute">${e(r,'quien','receptor')}</p>${loc(r)}</div><p class="font-semibold">${e(r,'cantidad_kg','kg')} kg</p>${badge(r.estado)}${SIG[r.estado]?`<button data-a="avanzar" data-id="${esc(r.id)}" class="${bg}">${SIG[r.estado][1]}</button>`:''}`)).join('')||empty('Aún no hay reservas.'),
 soporte:()=>all('rec').map(r=>card(row,`<div><p class="font-medium">${esc(TIPOS[r.tipo]||r.tipo)}</p><p class="text-sm text-mute">${e(r,'bascula','descripcion')}</p>${loc(r)}</div>${badge(g(r,'estado')||'ABIERTO')}`)).join('')||empty('No has reportado problemas.')
};
const SEL={
 cat:()=>cats().map(c=>`<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join(''),
 bas:()=>S.bas.map(b=>`<option value="${esc(b.id)}">${esc(g(b,'alias','codigo_dispositivo'))}</option>`).join('')||'<option value="">Sin básculas registradas</option>',
 ofe:()=>all('ofe').map(o=>`<option value="${esc(o.id)}">${esc(g(o,'titulo','nombre','producto'))}</option>`).join('')||'<option value="">Sin ofertas</option>'
};

// ── Vistas ──
const V={
 bascula:()=>`${title('Báscula','Registra un pesaje y envíalo a la plataforma.')}<div class="grid items-start gap-5 md:grid-cols-3">
 ${card('text-center md:col-span-2',`<p class="text-sm text-mute">Última lectura</p><div class="my-3 text-7xl font-semibold tracking-tight">${S.lect[0]?S.lect[0].g.toFixed(1):'—'} <span class="text-2xl font-normal text-mute">g</span></div><p class="text-sm text-mute">${S.lect[0]?esc(S.lect[0].c)+' · '+S.lect[0].h:'Aún no hay lecturas'}</p>`)}
 ${card('',`<form data-f="lectura" class="space-y-3">${F('Dispositivo',inp('dev','text','required list="bl" value="ESP32-BASCULA-01"')+'<datalist id="bl"></datalist>')}${F('Peso (gramos)',inp('peso','number','required min="0" step="0.1" value="450.0"'))}${F('Categoría',sel('cat','cat'))}<label class="flex items-center justify-between text-sm"><span>Dato simulado</span><input name="sim" type="checkbox" checked class="h-4 w-4 accent-brand"></label><div class="flex gap-2"><button class="${bp} flex-1">Enviar medición</button><button type="button" data-a="sim" class="${bg}">Simular</button></div></form>`)}</div>
 <h2 class="font-display mb-4 mt-10 text-2xl font-medium">Lecturas recientes</h2><div id="L" class="space-y-3"></div>`,
 dispositivos:()=>`${title('Dispositivos','Registra tus básculas ESP32 y revisa su última conexión.')}<div class="grid items-start gap-6 md:grid-cols-[1fr_1.4fr]">${card('',`<form data-f="bascula" class="space-y-3"><h2 class="font-display text-xl font-medium">Registrar báscula</h2>${F('ID de usuario',inp('usuario','number','required min="1"'))}${F('Código del dispositivo',inp('codigo','text','required placeholder="ESP32-BASCULA-02"'))}${F('Alias',inp('alias','text','placeholder="Mostrador"'))}${F('Clave de API',inp('key','password','required'))}<button class="${bp} w-full">Registrar báscula</button></form>`)}<div id="L" class="space-y-3"></div></div>`,
 predicciones:()=>`${title('Predicciones','Lo que podría sobrar. Conviértelo en una oferta con un clic.')}<div id="L" class="space-y-3"></div>`,
 ofertas:()=>`${title('Ofertas','Publica el alimento disponible para que otros lo reserven.')}<div class="grid items-start gap-6 md:grid-cols-[1fr_1.4fr]">${card('',`<form data-f="oferta" class="space-y-3"><h2 class="font-display text-xl font-medium">Publicar oferta</h2>${F('Producto',inp('titulo','text',`required placeholder="Pan dulce del día" value="${esc(S.pre?.producto)}"`))}${F('Categoría',sel('cat','cat'))}${F('Kilos disponibles',inp('kg','number',`required min="0.1" step="0.1" value="${esc(S.pre?.kg)}"`))}${F('Horario de recogida',inp('horario','text','required placeholder="6:00 a 8:00 pm"'))}${F('Ciudad',inp('ciudad','text','required value="Torreón"'))}<button class="${bp} w-full">Publicar oferta</button></form>`)}<div id="L" class="grid gap-4 sm:grid-cols-2"></div></div>`,
 reservas:()=>`${title('Reservas','Reserva kilos de una oferta y sigue su avance.')}<div class="grid items-start gap-6 md:grid-cols-[1fr_1.4fr]">${card('',`<form data-f="reserva" class="space-y-3"><h2 class="font-display text-xl font-medium">Nueva reserva</h2>${F('Oferta',sel('oferta','ofe'))}${F('Kilos a reservar',inp('kg','number','required min="0.1" step="0.1"'))}<button class="${bp} w-full">Reservar</button></form>`)}<div id="L" class="space-y-3"></div></div>`,
 soporte:()=>`${title('Soporte','Cuéntanos qué falla en tu báscula y le damos seguimiento.')}<div class="grid items-start gap-6 md:grid-cols-[1fr_1.4fr]">${card('',`<form data-f="soporte" class="space-y-3"><h2 class="font-display text-xl font-medium">Reportar un problema</h2>${F('Báscula',sel('bas','bas'))}${F('Tipo de problema',`<select name="tipo" class="${I}">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`)}${F('Descripción',`<textarea name="desc" rows="3" required class="${I}" placeholder="¿Qué pasó?"></textarea>`)}<button class="${bp} w-full">Enviar reporte</button></form>`)}<div id="L" class="space-y-3"></div></div>`
};

// ── Envío de datos ──
// AJUSTA los nombres de campo de oferta/reserva/reclamo si tus schemas de la API son distintos (ver /docs).
// Si la API los rechaza, el dato queda solo en pantalla y se avisa; nada se rompe.
const save=async(k,u,p,l)=>{try{await call('POST',u,p);return['ok','Guardado en la plataforma.']}catch(x){S.loc[k].unshift({...l,_local:true,id:'local-'+Date.now()});return['wait','Guardado solo en pantalla: la API respondió '+x.message+' Revisa el schema en /docs.']}};
const H={
 lectura:async d=>{const p={codigo_dispositivo:d.dev.trim(),peso_g:+d.peso,categoria_id:+d.cat,tipo:'lectura',es_simulada:!!d.sim};
  try{await call('POST','/basculas/lectura-esp32',p);S.lect.unshift({c:catName(p.categoria_id),g:p.peso_g,h:now(),s:p.es_simulada});return['ok',`Medición enviada: ${p.peso_g.toFixed(1)} g`]}catch(x){return['err',x.message]}},
 bascula:async d=>{try{await call('POST','/basculas',{usuario_id:+d.usuario,codigo_dispositivo:d.codigo.trim(),api_key:d.key,alias:d.alias||null});return['ok','Báscula registrada.']}catch(x){return['err',x.message]}},
 oferta:d=>save('ofe','/ofertas',{titulo:d.titulo,categoria_id:+d.cat,cantidad_kg:+d.kg,horario_recogida:d.horario,ciudad:d.ciudad},{titulo:d.titulo,categoria_id:+d.cat,cantidad_kg:+d.kg,horario_recogida:d.horario,ciudad:d.ciudad,estado:'ACTIVA'}),
 reserva:d=>{const o=all('ofe').find(x=>x.id==d.oferta),kg=+d.kg,max=+g(o,'cantidad_kg','kg');
  if(!o)return['err','Primero publica o elige una oferta.'];if(!(kg>0)||(max&&kg>max))return['err',`Elige entre 0.1 y ${max||'los disponibles'} kg.`];
  return save('res','/reservas',{oferta_id:+d.oferta||d.oferta,cantidad_kg:kg},{oferta:g(o,'titulo','nombre','producto'),quien:'Tú',cantidad_kg:kg,estado:'PENDIENTE'})},
 soporte:d=>{const b=S.bas.find(x=>x.id==d.bas);return save('rec','/reclamos',{bascula_id:+d.bas||null,tipo:d.tipo,descripcion:d.desc},{tipo:d.tipo,bascula:g(b,'alias','codigo_dispositivo'),descripcion:d.desc,estado:'ABIERTO'})}
};
const A={
 sim:()=>{$('[name=peso]').value=(50+Math.random()*850).toFixed(1);const s=$('[name=cat]');s.selectedIndex=Math.random()*s.options.length|0},
 pre:d=>{const p=S.pred[d.i];S.pre={producto:'Excedente de '+(g(p,'categoria','categoria_nombre')||catName(p.categoria_id)),cat:p.categoria_id,kg:g(p,'kg_estimado','excedente_estimado_kg','cantidad_kg','kg')};location.hash='#/ofertas'},
 avanzar:async d=>{const r=all('res').find(x=>x.id==d.id),n=SIG[r.estado][0];let k='ok',t=`Reserva ${n.toLowerCase()}.`;
  try{await call('PATCH','/reservas/'+r.id,{estado:n})}catch(x){k='wait';t='Cambio solo en pantalla: la API respondió '+x.message}
  r.estado=n;paint();note(k,t)}
};

// ── Render ──
const NEED={bascula:[['cat','/categorias'],['bas','/basculas']],dispositivos:[['bas','/basculas']],predicciones:[['cat','/categorias'],['pred','/predicciones']],ofertas:[['cat','/categorias'],['ofe','/ofertas']],reservas:[['ofe','/ofertas'],['res','/reservas']],soporte:[['bas','/basculas'],['rec','/reclamos']]};
const TABS=[['bascula','Báscula'],['dispositivos','Dispositivos'],['predicciones','Predicciones'],['ofertas','Ofertas'],['reservas','Reservas'],['soporte','Soporte']];
function paint(){const l=$('#L');if(l)l.innerHTML=L[S.tab]();
 document.querySelectorAll('[data-sel]').forEach(s=>{const v=s.value;s.innerHTML=SEL[s.dataset.sel]();if(v)s.value=v});
 const d=$('#bl');if(d)d.innerHTML=S.bas.map(b=>`<option value="${esc(b.codigo_dispositivo)}">`).join('')}
async function refresh(){const t=S.tab;await Promise.all(NEED[t].map(([k,u])=>call('GET',u).then(r=>{S[k]=Array.isArray(r)?r:[]}).catch(()=>{})));if(S.tab===t)paint()}
function render(){const h=location.hash.replace('#/','');S.tab=V[h]?h:'bascula';
 $('#app').innerHTML=V[S.tab]();
 $('#nav').innerHTML=TABS.map(([k,n])=>`<a href="#/${k}" class="whitespace-nowrap rounded-full px-4 py-2 text-sm ${S.tab===k?'bg-white font-semibold text-brand':'text-white/85 hover:bg-white/10 hover:text-white'}">${n}</a>`).join('');
 paint();if(S.pre){const s=$('[name=cat]');if(s)s.value=S.pre.cat;S.pre=null}refresh()}

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a)A[a.dataset.a](a.dataset)});
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target,b=f.querySelector('button:not([type=button])');b.disabled=true;
 const [k,t]=await H[f.dataset.f](Object.fromEntries(new FormData(f)));b.disabled=false;
 if(k!=='err'&&f.dataset.f!=='lectura')f.reset();paint();note(k,t);if(k!=='err')refresh().then(()=>note(k,t))});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
fetch(BASE+'/health').then(r=>{$('#api').textContent=r.ok?'● API conectada':'API con error'}).catch(()=>{$('#api').textContent='Sin conexión con la API'});
render();
</script></body></html>
